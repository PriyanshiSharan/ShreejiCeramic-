<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquant Portal</title>
    <!-- Modern Sans for UI and Elegant Serif for Headings -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">
    <div class="landing-card">
        <div class="landing-logo-group">
            <div class="logo-a-box">S</div>
            <h2 class="landing-brand">SHREE JI CERAMIC</h2>
            <p class="landing-sub-brand">CURATING EXCELLENCE</p>
        </div>
        
        <h1 class="landing-title">Shree Ji Ceramic Portal</h1>
        
        <p class="landing-desc">
            Explore our curated collection of premium bathroom solutions from the world's leading brands.
        </p>

        <div class="brand-selection">
            <div class="brand-card" id="aquantCard">
                <div class="brand-logo">AQUANT</div>
                <p>Redefining Luxury</p>
                <div class="explore-btn">Explore Aquant</div>
            </div>
            
            <div class="brand-card" id="kohlerCard">
                <div class="brand-logo">KOHLER</div>
                <p>The Bold Look of Kohler</p>
                <div class="explore-btn">Explore Kohler</div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Coming Soon!</div>

    <script src="landing.js"></script>
</body>
</html>
